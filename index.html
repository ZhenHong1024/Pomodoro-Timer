<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="timer-card" aria-labelledby="app-title">
      <h1 id="app-title">Pomodoro Timer</h1>

      <p id="modeLabel" class="mode-label" aria-live="polite">Work</p>

      <div class="timer-ring" role="timer" aria-live="polite" aria-atomic="true">
        <svg class="progress-ring" viewBox="0 0 240 240" aria-hidden="true">
          <circle class="progress-ring__track" cx="120" cy="120" r="108"></circle>
          <circle
            id="progressCircle"
            class="progress-ring__progress"
            cx="120"
            cy="120"
            r="108"
          ></circle>
        </svg>
        <time id="timerDisplay" class="timer-display" datetime="PT25M">25:00</time>
      </div>

      <p class="session-counter">
        Completed sessions:
        <strong id="sessionCount" aria-label="Completed work sessions">0</strong>
      </p>

      <div class="controls" aria-label="Timer controls">
        <button id="startPauseButton" type="button" aria-label="Start timer">Start</button>
        <button id="resetButton" type="button" aria-label="Reset timer">Reset</button>
        <button id="notificationButton" type="button" aria-label="Enable browser notifications">
          Enable Notifications
        </button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
